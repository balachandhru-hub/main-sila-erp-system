<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231f5cc4'%3E%3Cpath d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>SILA Procurement System</title>
    <!-- Store manifest is added only on /mobile, so the ERP pages are not installed as SILA Store. -->
    <script>
      (function () {
        var path = location.pathname;
        if (path !== "/mobile" && path.indexOf("/mobile/") !== 0) return;
        var head = document.head;
        var manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = "/mobile/manifest.webmanifest";
        head.appendChild(manifest);
        var icon = document.createElement("link");
        icon.rel = "apple-touch-icon";
        icon.href = "/mobile/icon-180.png";
        head.appendChild(icon);
        [
          ["mobile-web-app-capable", "yes"],
          ["apple-mobile-web-app-capable", "yes"],
          ["apple-mobile-web-app-status-bar-style", "default"],
          ["apple-mobile-web-app-title", "SILA Store"]
        ].forEach(function (pair) {
          var meta = document.createElement("meta");
          meta.name = pair[0];
          meta.content = pair[1];
          head.appendChild(meta);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
